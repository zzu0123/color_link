<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLOR LINK</title><style>body{background:#20242c;color:white;font-family:system-ui;text-align:center;margin:12px auto;max-width:500px;padding:8px}h1{letter-spacing:5px}button{padding:10px;border:1px solid #777;border-radius:7px;background:#39414e;color:white;margin:3px;cursor:pointer}button:disabled{opacity:.35}#board{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;background:#777;touch-action:none} .cell{aspect-ratio:1;background:#f3f0e9;position:relative;display:grid;place-items:center;min-width:0}.piece{width:84%;height:84%;border-radius:50%;display:grid;place-items:center;color:#111;font:bold 18px Georgia;z-index:1;pointer-events:none}#palette{display:grid;grid-template-columns:repeat(7,1fr);margin:8px 0}#palette button{color:#111;padding:7px 0;margin:2px;font-weight:bold}#timer{font-size:32px;font-weight:bold}#msg{min-height:45px}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}small{color:#c7cbd2}</style><small>THE DEVIL'S PLAN · FAN GAME</small><h1>COLOR LINK</h1><div id="score"></div><div id="timer"></div><p id="msg"></p><div id="board"></div><div id="palette"></div><button id="undo">되돌리기</button><button id="ok">배치 확정</button><button id="challenge">불가능 선언</button><button id="clear">경로 지우기</button><button id="next">다음 라운드</button><button id="reset">새 게임</button><p><small>선공 1개, 이후 서로 다른 색 2개. 같은 색은 최소 6칸으로 연결. 배치 3분 / 증명 5분 / 3점 선취. 방송의 미확인 초기 배치 대신 빈 판을 사용합니다.</small></p><script>
const $=id=>document.getElementById(id),C=['#e93648','#ffb63d','#ffe14b','#c8df39','#52cc79','#168d87','#36b9e8','#2879df','#a653d7','#ec36a9','#f39db9','#ae7950','#a6a8b5','#ef783e'];let b,p,turn,starter=0,score=[0,0],round=1,phase,pending,moves,sel,deadline,last,challenger,drag=-1,loser;const L=i=>String.fromCharCode(65+i),adj=(a,z)=>Math.abs(a%10-z%10)+Math.abs((a/10|0)-(z/10|0))===1,count=i=>b.filter(x=>x===i).length,owner=i=>p.findIndex(a=>a.includes(i)),need=()=>moves===0?1:Math.min(2,28-b.filter(x=>x>=0).length+pending.length);function clock(s){deadline=Date.now()+s*1000}function init(){b=Array(110).fill(-1);p=C.map(()=>[]);turn=starter;phase='place';pending=[];moves=0;sel=0;last=-1;drag=-1;clock(180);render()}function render(){$('score').textContent=`ROUND ${round}/5  |  PLAYER 1: ${score[0]}  —  PLAYER 2: ${score[1]}`;$('board').innerHTML='';b.forEach((v,i)=>{let d=document.createElement('div');d.className='cell';let o=owner(i);if(o>=0){let a=p[o],k=a.indexOf(i);d.style.background=C[o]+'55';d.innerHTML='<svg viewBox="0 0 100 100">'+[a[k-1],a[k+1]].filter(x=>x!==undefined).map(x=>`<line x1="50" y1="50" x2="${50+(x%10-i%10)*50}" y2="${50+((x/10|0)-(i/10|0))*50}" stroke="${C[o]}" stroke-width="25"/>`).join('')+'</svg>'}if(v>=0){let s=document.createElement('span');s.className='piece';s.style.background=C[v];s.textContent=L(v);if(pending.includes(i))s.style.outline='2px dashed black';d.append(s)}$('board').append(d)});$('palette').innerHTML='';C.forEach((c,i)=>{let x=document.createElement('button');x.style.background=c;x.textContent=L(i)+' · '+(2-count(i));x.disabled=phase!=='place'||count(i)>=2||pending.some(v=>b[v]===i);if(sel===i)x.style.outline='2px solid white';x.onclick=()=>{sel=i;render()};$('palette').append(x)});$('ok').textContent=phase==='proof'?'증명 완료':'배치 확정';$('ok').disabled=phase==='place'?pending.length!==need():phase!=='proof';$('challenge').disabled=phase!=='place'||last<0||pending.length>0;$('undo').disabled=phase!=='place'||!pending.length;$('clear').hidden=phase!=='proof';$('next').hidden=phase!=='end';if(phase==='place')$('msg').textContent=`PLAYER ${turn+1} 차례 · ${need()}개 배치 (${pending.length}/${need()})`;if(phase==='proof')$('msg').textContent=`PLAYER ${turn+1} 증명 차례 · 같은 색을 드래그하여 연결`}
function award(w,s){score[w]++;loser=1-w;phase=score[w]>=3||round>=5?'match':'end';render();$('msg').textContent=s+' · PLAYER '+(w+1)+(phase==='match'?' 최종 승리!':' 라운드 승리!')}function proof(){challenger=turn;turn=last;phase='proof';p=C.map(()=>[]);clock(300);render()}function locate(e){let r=$('board').getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*10),y=Math.floor((e.clientY-r.top)/r.height*11);return x>=0&&x<10&&y>=0&&y<11?y*10+x:-1}function place(i){if(pending.includes(i)){b[i]=-1;pending=pending.filter(x=>x!==i);render();return}if(b[i]>=0||pending.length>=need()||count(sel)>=2||pending.some(v=>b[v]===sel))return;b[i]=sel;pending.push(i);let k=C.findIndex((_,j)=>count(j)<2&&!pending.some(v=>b[v]===j));if(k>=0)sel=k;render()}
$('board').onpointerdown=e=>{let i=locate(e);if(i<0)return;if(phase==='place')place(i);else if(phase==='proof'&&b[i]>=0){drag=b[i];p[drag]=[i];$('board').setPointerCapture(e.pointerId);render()}};$('board').onpointermove=e=>{if(phase!=='proof'||drag<0)return;let i=locate(e),a=p[drag],v=a.at(-1);if(i<0||!adj(v,i))return;let k=a.indexOf(i);if(k>=0){p[drag]=a.slice(0,k+1);render();return}if(a.length>1&&b[v]===drag||b[i]>=0&&b[i]!==drag||owner(i)>=0&&owner(i)!==drag)return;a.push(i);render()};$('board').onpointerup=$('board').onpointercancel=()=>drag=-1;$('undo').onclick=()=>{if(pending.length){let i=pending.pop();sel=b[i];b[i]=-1;render()}};$('challenge').onclick=proof;$('ok').onclick=()=>{if(phase==='place'){if(pending.length!==need())return;pending=[];moves++;last=turn;turn=1-turn;clock(180);if(b.filter(x=>x>=0).length===28)proof();else render()}else if(phase==='proof'){let bad=C.findIndex((_,i)=>count(i)===2&&(p[i].length<6||b[p[i][0]]!==i||b[p[i].at(-1)]!==i));if(bad>=0){$('msg').textContent=L(bad)+' 연결을 완성하세요';return}award(turn,'증명 성공')}};$('clear').onclick=()=>{p=C.map(()=>[]);render()};$('next').onclick=()=>{if(phase!=='end')return;round++;starter=confirm('PLAYER '+(loser+1)+'이 선공을 하겠습니까?')?loser:1-loser;init()};$('reset').onclick=()=>{if(confirm('새 게임을 시작할까요?')){score=[0,0];round=1;starter=0;init()}};setInterval(()=>{if(phase==='end'||phase==='match')return;let t=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('timer').textContent=String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(!t)award(phase==='proof'?challenger:1-turn,'시간 초과')},200);init();</script></html>
