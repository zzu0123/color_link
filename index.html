<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COLOR LINK ONLINE</title><style>body{background:#151923;color:#eee;font:15px system-ui;max-width:520px;margin:auto;padding:14px;text-align:center}h1{letter-spacing:5px}button,input,select{font:inherit;padding:10px;margin:3px;border-radius:8px;border:1px solid #647084;background:#30394a;color:white}button:disabled{opacity:.35}#board{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;background:#777;touch-action:none}.cell{aspect-ratio:1;background:#f2eee4;position:relative;display:grid;place-items:center;min-width:0}.wall{background:#343a48;box-shadow:inset 0 0 0 2px #515968}.piece{width:84%;height:84%;border-radius:50%;display:grid;place-items:center;color:#111;font:bold 16px Georgia;z-index:1;pointer-events:none}#palette{display:grid;grid-template-columns:repeat(7,1fr)}#palette button{color:#111;padding:7px 0;margin:2px;font-weight:bold}#timer{font-size:32px;font-weight:bold}svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}small{color:#b7c2d6}#status{color:#ffcf79;overflow-wrap:anywhere}#preview{display:grid;grid-template-columns:repeat(10,1fr);gap:1px;width:120px;margin:8px auto}#preview span{aspect-ratio:1} [hidden]{display:none!important}</style><small>THE DEVIL'S PLAN · FAN GAME</small><h1>COLOR LINK</h1><div id="lobby"><select id="map"></select><div id="preview"></div><button id="local">한 기기 대결</button><button id="create">온라인 방 만들기</button><div><input id="code" placeholder="6자리 방 코드" maxlength="6"><button id="join">입장</button></div></div><p id="status"></p><section id="game" hidden><div id="room"></div><div id="score"></div><div id="timer"></div><p id="msg"></p><div id="board"></div><div id="palette"></div><button id="undo">되돌리기</button><button id="ok">배치 확정</button><button id="challenge">불가능 선언</button><button id="clear">경로 지우기</button><div id="nextbox" hidden><select id="nextmap"></select><select id="first"><option value="self">패자 선공</option><option value="other">패자 후공</option></select><button id="next">다음 라운드 / 재대결</button></div><button id="leave">나가기</button></section><p><small>선공 1개, 이후 서로 다른 색 2개. 최소 6칸 연결. 배치 3분 / 증명 5분 / 3점 선취. 검은 칸은 통과 불가. 미확인 방송 세부 규칙은 팬게임 방식으로 적용.</small></p><script type="module">

const $=id=>document.getElementById(id), C=['#e93648','#ffb63d','#ffe14b','#c8df39','#52cc79','#168d87','#36b9e8','#2879df','#a653d7','#ec36a9','#f39db9','#ae7950','#a6a8b5','#ef783e'];
const maps=[['클래식',()=>false],['중앙 장벽',(x,y)=>x===4&&y>=2&&y<=8&&y!==5],['이중 장벽',(x,y)=>(x===3&&y>=1&&y<=7)||(x===6&&y>=3&&y<=9)],['미로',(x,y)=>(y===2&&x<7)||(y===5&&x>2)||(y===8&&x<7)],['십자',(x,y)=>(x===4&&y>=3&&y<=7)||(y===5&&x>=2&&x<=6)],['네 기둥',(x,y)=>[2,7].includes(x)&&[2,3,7,8].includes(y)],['지그재그',(x,y)=>(x===2&&y<5)||(x===5&&y>5)||(x===7&&y<5)],['요새',(x,y)=>((x===3||x===6)&&y>=3&&y<=7&&y!==5)||((y===3||y===7)&&x>=3&&x<=6)],['섬',(x,y)=>x>=4&&x<=5&&y>=4&&y<=6],['체커 장벽',(x,y)=>[2,5,8].includes(y)&&[1,4,7].includes(x)]];
for(const id of ['map','nextmap'])maps.forEach(([name],i)=>$(id).add(new Option(`${i+1}. ${name}`,i)));
const walls=m=>Array.from({length:110},(_,i)=>maps[m][1](i%10,i/10|0)?-2:-1);function preview(){ $('preview').innerHTML=walls(+$('map').value).map(v=>`<span style="background:${v===-2?'#343a48':'#f2eee4'}"></span>`).join('') }$('map').onchange=preview;preview();
let state=null,mode='',seat=0,uid,db,api,roomRef,unsub,code='',busy=false,sel=0,pending=[],paths=emptyPaths(),drag=-1;function emptyPaths(){return Array.from({length:14},()=>[])}const L=i=>String.fromCharCode(65+i),adj=(a,b)=>Math.abs(a%10-b%10)+Math.abs((a/10|0)-(b/10|0))===1;
function fresh(map,turn=0,score=[0,0],round=1){return {map,b:walls(map),turn,score,round,phase:'place',moves:0,last:-1,challenger:-1,loser:-1,deadline:Date.now()+180000,rev:0,reason:''}}
function decode(s){return s.proof?JSON.parse(s.proof):emptyPaths()}function active(){return state&&state.phase!=='waiting'&&(mode==='local'||seat===state.turn)&&!busy}function draft(){let b=state.b.slice();pending.forEach(([i,c])=>b[i]=c);return b}const count=(b,c)=>b.filter(v=>v===c).length;const need=s=>s.moves===0?1:Math.min(2,28-s.b.filter(v=>v>=0).length);
function receive(s){if(!s)return;let changed=!state||s.rev!==state.rev||s.phase!==state.phase;if(changed){pending=[];paths=decode(s);drag=-1;sel=0}state=s;render()}
function render(){if(!state)return;let s=state,b=draft(),can=active(),pp=s.phase==='proof'?paths:emptyPaths();$('lobby').hidden=true;$('game').hidden=false;$('room').textContent=mode==='local'?'한 기기 대결':`방 ${code} · 나는 PLAYER ${seat+1}`;$('score').textContent=`${maps[s.map][0]} · ROUND ${s.round}/5 | P1 ${s.score[0]} : ${s.score[1]} P2`;$('msg').textContent=s.phase==='waiting'?'친구의 입장을 기다리는 중':s.phase==='place'?`PLAYER ${s.turn+1} 차례 · ${need(s)}개 배치 (${pending.length}/${need(s)})`:s.phase==='proof'?`PLAYER ${s.turn+1} 증명 차례 · 최소 6칸`:s.reason;$('board').innerHTML='';b.forEach((v,i)=>{let d=document.createElement('div');d.className='cell'+(v===-2?' wall':'');let o=pp.findIndex(a=>a.includes(i));if(o>=0){let a=pp[o],k=a.indexOf(i);d.style.background=C[o]+'55';d.innerHTML='<svg viewBox="0 0 100 100">'+[a[k-1],a[k+1]].filter(x=>x!==undefined).map(x=>`<line x1="50" y1="50" x2="${50+(x%10-i%10)*50}" y2="${50+((x/10|0)-(i/10|0))*50}" stroke="${C[o]}" stroke-width="25"/>`).join('')+'</svg>'}if(v>=0){let t=document.createElement('span');t.className='piece';t.style.background=C[v];t.textContent=L(v);d.append(t)}$('board').append(d)});$('palette').innerHTML='';C.forEach((c,i)=>{let t=document.createElement('button');t.style.background=c;t.textContent=L(i)+' · '+(2-count(b,i));t.disabled=!can||s.phase!=='place'||count(b,i)>=2||pending.some(a=>a[1]===i);if(sel===i)t.style.outline='2px solid white';t.onclick=()=>{sel=i;render()};$('palette').append(t)});$('ok').textContent=s.phase==='proof'?'증명 완료':'배치 확정';$('ok').disabled=!can||!(s.phase==='proof'||s.phase==='place'&&pending.length===need(s));$('undo').disabled=!can||!pending.length;$('challenge').disabled=!can||s.phase!=='place'||s.last<0||pending.length>0;$('clear').hidden=s.phase!=='proof';$('clear').disabled=!can;$('nextbox').hidden=!['end','match'].includes(s.phase)||(mode==='online'&&seat!==s.loser);}
async function connect(){if(api)return;if(!firebaseConfig.apiKey||!firebaseConfig.databaseURL)throw Error('Firebase 설정을 먼저 입력하세요. 한 기기 모드는 바로 이용 가능합니다.');let [a,b,c]=await Promise.all([import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js'),import('https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js')]);let app=a.initializeApp(firebaseConfig);let auth=b.getAuth(app);await auth.authStateReady();uid=(auth.currentUser|| (await b.signInAnonymously(auth)).user).uid;db=c.getDatabase(app);api=c;}
async function enter(create){try{$('status').textContent='연결 중…';await connect();code=create?Array.from(crypto.getRandomValues(new Uint8Array(6)),v=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[v%32]).join(''):$('code').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(code))throw Error('6자리 코드를 입력하세요');roomRef=api.ref(db,'rooms/'+code);let result=await api.runTransaction(roomRef,r=>{if(create){if(r)return;return {...fresh(+$('map').value),phase:'waiting',host:uid}}if(!r)return;if(r.host===uid||r.guest===uid)return r;if(r.guest||r.phase!=='waiting')return;return {...r,guest:uid,phase:'place',deadline:Date.now()+180000,rev:r.rev+1}});if(!result.committed)throw Error('방이 없거나 이미 가득 찼습니다. 다시 시도하세요.');let r=result.snapshot.val();seat=r.host===uid?0:1;mode='online';receive(r);unsub=api.onValue(roomRef,s=>receive(s.val()),e=>$('status').textContent=e.message);$('status').textContent='';}catch(e){$('status').textContent=e.message}}
$('create').onclick=()=>enter(true);$('join').onclick=()=>enter(false);$('local').onclick=()=>{mode='local';receive(fresh(+$('map').value))};
async function update(fn,timeout=false){if(busy||!state)return;let rev=state.rev;busy=true;try{if(mode==='local'){let n=fn(structuredClone(state));if(n){n.rev=rev+1;receive(n)}}else{let res=await api.runTransaction(roomRef,r=>{if(!r||r.rev!==rev||(!timeout&&r.turn!==seat&&!( ['end','match'].includes(r.phase)&&r.loser===seat)))return;let n=fn(r);if(n){n.rev=rev+1;return n}});if(!res.committed)$('status').textContent='상태가 변경되었습니다. 다시 시도하세요.';else receive(res.snapshot.val())}}catch(e){$('status').textContent=e.message}finally{busy=false;render()}}
function award(s,w,reason){s.score[w]++;s.loser=1-w;s.phase=s.score[w]>=3||s.round>=5?'match':'end';s.reason=reason+' · PLAYER '+(w+1)+(s.phase==='match'?' 최종 승리!':' 라운드 승리!');return s}function proof(s){s.challenger=s.turn;s.turn=s.last;s.phase='proof';s.deadline=Date.now()+300000;s.proof='';return s}
function locate(e){let r=$('board').getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*10),y=Math.floor((e.clientY-r.top)/r.height*11);return x>=0&&x<10&&y>=0&&y<11?y*10+x:-1}
$('board').onpointerdown=e=>{if(!active())return;let i=locate(e),b=draft();if(i<0||b[i]===-2)return;if(state.phase==='place'){let k=pending.findIndex(a=>a[0]===i);if(k>=0)pending.splice(k,1);else if(b[i]===-1&&pending.length<need(state)&&count(b,sel)<2&&!pending.some(a=>a[1]===sel)){pending.push([i,sel]);let j=C.findIndex((_,c)=>count(draft(),c)<2&&!pending.some(a=>a[1]===c));if(j>=0)sel=j}render()}else if(state.phase==='proof'&&b[i]>=0){drag=b[i];paths[drag]=[i];$('board').setPointerCapture(e.pointerId);render()}};
$('board').onpointermove=e=>{if(!active()||drag<0||state.phase!=='proof')return;let i=locate(e),a=paths[drag],v=a.at(-1),b=state.b;if(i<0||b[i]===-2||!adj(v,i))return;let k=a.indexOf(i);if(k>=0)paths[drag]=a.slice(0,k+1);else if(!(a.length>1&&b[v]===drag)&&!(b[i]>=0&&b[i]!==drag)&&!paths.some((p,j)=>j!==drag&&p.includes(i)))a.push(i);render()};
function saveProof(){if(drag<0)return;drag=-1;let snapshot=JSON.stringify(paths);update(s=>{if(s.phase!=='proof'||Date.now()>=s.deadline)return;s.proof=snapshot;return s})}$('board').onpointerup=$('board').onpointercancel=saveProof;
$('undo').onclick=()=>{if(active()){pending.pop();render()}};$('challenge').onclick=()=>{if(active())update(s=>s.phase==='place'&&s.last>=0&&Date.now()<s.deadline?proof(s):undefined)};$('clear').onclick=()=>{if(active())update(s=>{s.proof='';return s})};
$('ok').onclick=()=>{if(!active())return;let moves=pending.slice(),pp=structuredClone(paths);update(s=>{if(Date.now()>=s.deadline)return;if(s.phase==='place'){if(moves.length!==need(s)||new Set(moves.map(a=>a[1])).size!==moves.length)return;for(let [i,c] of moves){if(s.b[i]!==-1||count(s.b,c)>=2)return;s.b[i]=c}s.moves++;s.last=s.turn;s.turn=1-s.turn;s.deadline=Date.now()+180000;if(s.b.filter(v=>v>=0).length===28)return proof(s);return s}if(s.phase==='proof'){let used=new Set();for(let c=0;c<14;c++){let p=pp[c];if(count(s.b,c)===2&&(p.length<6||s.b[p[0]]!==c||s.b[p.at(-1)]!==c)){ $('status').textContent=L(c)+' 연결을 완성하세요';return}for(let j=0;j<p.length;j++){let i=p[j];if(used.has(i)||s.b[i]===-2||s.b[i]>=0&&s.b[i]!==c||j&&!adj(p[j-1],i))return;used.add(i)}}return award(s,s.turn,'증명 성공')}})};
$('next').onclick=()=>{let m=+$('nextmap').value,first=$('first').value;update(s=>{if(!['end','match'].includes(s.phase))return;let n=fresh(m,first==='self'?s.loser:1-s.loser,s.phase==='match'?[0,0]:s.score,s.phase==='match'?1:s.round+1);if(s.host)n.host=s.host;if(s.guest)n.guest=s.guest;return n})};$('leave').onclick=()=>{if(unsub)unsub();location.reload()};setInterval(()=>{if(!state)return;let s=state,t=['place','proof'].includes(s.phase)?Math.max(0,Math.ceil((s.deadline-Date.now())/1000)):0;$('timer').textContent=String(t/60|0).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(!t&&['place','proof'].includes(s.phase))update(r=>Date.now()>=r.deadline&&['place','proof'].includes(r.phase)?award(r,r.phase==='proof'?r.challenger:1-r.turn,'시간 초과'):undefined,true)},500);
